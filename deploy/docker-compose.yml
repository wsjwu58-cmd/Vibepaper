version: "3.8"
# VibePaper 基础设施编排（开发环境）
services:
  postgres:
    image: postgres:18
    container_name: vibepaper-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwer1234
    ports:
      - "5432:5432"
    volumes:
      - vibepaper-pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: vibepaper-redis
    command: redis-server --requirepass qwer1234
    ports:
      - "6379:6379"
    volumes:
      - vibepaper-redis-data:/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: vibepaper-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"
      - "9848:9848"

  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: vibepaper-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: vibepaper-rocketmq-broker
    command: sh mqbroker -n 192.168.141.128:9876 --enable-proxy
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      - ./broker.conf:/home/rocketmq/conf/broker.conf

  minio:
    image: minio/minio:latest
    container_name: vibepaper-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vibepaper-minio-data:/data

volumes:
  vibepaper-pg-data:
  vibepaper-redis-data:
  vibepaper-minio-data:
