[project]
name = "generation-service"
version = "1.0.0"
description = "VibePaper Generation Service (FastAPI + Celery)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "celery>=5.4",
    "pillow>=10.4",
    "imageio-ffmpeg>=0.5",
    "httpx>=0.27",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mq = ["rocketmq-client-python>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generation"]
