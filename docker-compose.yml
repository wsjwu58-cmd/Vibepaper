name: vibepaper

# =============================================================================
# VibePaper 全栈一键部署
#
#   VIBEPAPER_LLM_API_KEY=xxx VIBEPAPER_AGNES_API_KEY=xxx docker compose up -d --build
#
# 组件：PostgreSQL 18 · Redis 7 · Nacos · 8 个 Java 微服务 · generation-service
#       · agent-service（Node.js + Pi Agent Core）· vibepaper-web（Nginx）
#
# 说明：
#   - 生成服务默认 inline 执行器，无需 RocketMQ；如需 MQ/MinIO 见 deploy/docker-compose.yml
#   - 敏感配置（API Key、内部令牌、签名密钥）一律通过环境变量注入，默认值仅供本地体验
# =============================================================================

x-java-env: &java-env
  PG_HOST: postgres
  PG_USER: ${PG_USER:-postgres}
  PG_PASSWORD: ${PG_PASSWORD:-qwer1234}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-qwer1234}
  NACOS_ADDR: nacos:8848
  JWT_SECRET: ${JWT_SECRET:-vibepaper-jwt-secret-key-2026-matrix-pixel-platform}

x-java-build: &java-build
  context: .
  target: java

services:
  # ---------------------------------------------------------------- 基础设施
  postgres:
    image: postgres:18-alpine
    container_name: vibepaper-pg
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-qwer1234}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vibepaper-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-qwer1234}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-qwer1234} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: vibepaper-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"

  # ---------------------------------------------------------------- Java 微服务
  identity-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: identity-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  canvas-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: canvas-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  asset-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: asset-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  billing-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: billing-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  enterprise-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: enterprise-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  gallery-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: gallery-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  admin-service:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: admin-service
    environment: *java-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  gateway:
    build:
      <<: *java-build
      args:
        SERVICE_NAME: vibepaper-gateway
    environment:
      <<: *java-env
      # Agent 不注册 Nacos，网关直连（容器内 DNS）
      AGENT_SERVICE_URI: http://agent-service:8091
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------- 生成服务
  generation-service:
    build:
      context: .
      target: generation
    environment: &generation-env
      VIBEPAPER_ENVIRONMENT: production
      VIBEPAPER_DATABASE_URL: postgresql+psycopg2://${PG_USER:-postgres}:${PG_PASSWORD:-qwer1234}@postgres:5432/vibepaper_generation
      VIBEPAPER_REDIS_URL: redis://:${REDIS_PASSWORD:-qwer1234}@redis:6379/3
      VIBEPAPER_TASK_EXECUTOR: inline
      VIBEPAPER_BILLING_BASE_URL: http://billing-service:8084
      VIBEPAPER_IDENTITY_BASE_URL: http://identity-service:8081
      VIBEPAPER_ADMIN_BASE_URL: http://admin-service:8087
      VIBEPAPER_CANVAS_BASE_URL: http://canvas-service:8082
      VIBEPAPER_AGENT_BASE_URL: http://agent-service:8091
      VIBEPAPER_INTERNAL_SERVICE_TOKEN: ${VIBEPAPER_INTERNAL_SERVICE_TOKEN:-}
      VIBEPAPER_LLM_API_KEY: ${VIBEPAPER_LLM_API_KEY:-}
      VIBEPAPER_AGNES_API_KEY: ${VIBEPAPER_AGNES_API_KEY:-}
    volumes:
      - generation-data:/data/generation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- Agent 服务
  agent-migrate:
    build:
      context: .
      target: agent
    environment: &agent-env
      VIBEPAPER_PORT: 8091
      VIBEPAPER_DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-qwer1234}@postgres:5432/vibepaper_agent
      VIBEPAPER_REDIS_URL: redis://:${REDIS_PASSWORD:-qwer1234}@redis:6379/5
      VIBEPAPER_CANVAS_BASE_URL: http://canvas-service:8082
      VIBEPAPER_ASSET_BASE_URL: http://asset-service:8083
      VIBEPAPER_BILLING_BASE_URL: http://billing-service:8084
      VIBEPAPER_GENERATION_BASE_URL: http://generation-service:8090
      VIBEPAPER_IDENTITY_BASE_URL: http://identity-service:8081
      VIBEPAPER_ADMIN_BASE_URL: http://admin-service:8087
      VIBEPAPER_CONFIRM_SIGNING_SECRET: ${VIBEPAPER_CONFIRM_SIGNING_SECRET:-}
      VIBEPAPER_INTERNAL_SERVICE_TOKEN: ${VIBEPAPER_INTERNAL_SERVICE_TOKEN:-}
      VIBEPAPER_LLM_API_KEY: ${VIBEPAPER_LLM_API_KEY:-}
      VIBEPAPER_AGNES_API_KEY: ${VIBEPAPER_AGNES_API_KEY:-}
      VIBEPAPER_SNOWFLAKE_WORKER_ID: "1"
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  agent-service:
    build:
      context: .
      target: agent
    environment: *agent-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------- 前端
  web:
    build:
      context: .
      target: web
    ports:
      - "5173:80"
    depends_on:
      - gateway
      - agent-service
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  generation-data:
