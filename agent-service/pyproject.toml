[project]
name = "agent-service"
version = "1.0.0"
description = "VibePaper Agent Service (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "psycopg[binary,pool]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0,<6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "celery>=5.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
