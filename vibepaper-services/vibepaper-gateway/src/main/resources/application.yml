server:
  port: 8080

spring:
  application:
    name: vibepaper-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.141.129:8848}
        username: nacos
        password: nacos
      config:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      # Downstream (e.g. FastAPI) may also set CORS; keep a single Allow-Origin value
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/me/**,/api/v1/users/**,/api/v1/rewards/**,/api/v1/invites/**
        - id: billing-task-create
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/tasks
            - Method=POST
        - id: billing-task-cancel
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/tasks/*/cancel
        - id: generation-service
          uri: lb://generation-service
          predicates:
            - Path=/api/v1/tasks/**,/api/v1/models/**,/api/v1/tasks
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/v1/accounts/**,/api/v1/ledgers/**,/api/v1/recharge/**,/api/v1/subscriptions/**,/api/v1/packages/**
        - id: canvas-service
          uri: lb://canvas-service
          predicates:
            - Path=/api/v1/canvases/**
        - id: asset-service
          uri: lb://asset-service
          predicates:
            - Path=/api/v1/assets/**
        - id: enterprise-service
          uri: lb://enterprise-service
          predicates:
            - Path=/api/v1/enterprises/**,/api/v1/invitations/**
        - id: gallery-service
          uri: lb://gallery-service
          predicates:
            - Path=/api/v1/gallery/**,/api/v1/publications/**
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/api/v1/agent/**,/api/v1/skills/**,/api/v1/memories/**
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/v1/admin/**,/api/v1/announcements/**,/api/v1/audit-logs/**
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:qwer1234}
      timeout: 3s

vibepaper:
  jwt:
    secret: ${JWT_SECRET:vibepaper-jwt-secret-key-2026-matrix-pixel-platform}
    access-ttl: 900
    refresh-ttl: 604800

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.vibepaper: INFO
