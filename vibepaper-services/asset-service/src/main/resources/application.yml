server:
  port: 8083

spring:
  application:
    name: asset-service
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/vibepaper_asset
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:qwer1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.141.129:8848}
        username: nacos
        password: nacos
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

vibepaper:
  storage:
    mode: ${STORAGE_MODE:local}
    local-path: ${STORAGE_LOCAL_PATH:E:\VibePaperProject\data\assets}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

logging:
  level:
    com.vibepaper: INFO
