server:
  port: 8082

spring:
  application:
    name: canvas-service
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/vibepaper_canvas
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:qwer1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.141.129:8848}
        username: nacos
        password: nacos
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vibepaper: INFO
