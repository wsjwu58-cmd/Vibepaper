server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/vibepaper_identity
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:qwer1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:qwer1234}
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.141.129:8848}
        username: nacos
        password: nacos
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

vibepaper:
  jwt:
    secret: ${JWT_SECRET:vibepaper-jwt-secret-key-2026-matrix-pixel-platform}
    access-ttl: 900
    refresh-ttl: 604800

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vibepaper: INFO
