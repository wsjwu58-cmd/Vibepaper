server:
  port: 8084

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/vibepaper_billing
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:qwer1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:qwer1234}
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.141.129:8848}
        username: nacos
        password: nacos
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

rocketmq:
  name-server: ${ROCKETMQ_ADDR:192.168.141.128:9876}
  producer:
    group: billing-producer
    send-message-timeout: 3000

vibepaper:
  mq:
    direct-fallback: ${MQ_DIRECT_FALLBACK:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: input

logging:
  level:
    com.vibepaper: INFO
    org.apache.rocketmq: WARN
